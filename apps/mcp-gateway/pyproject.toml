[project]
name = "mcp-gateway"
version = "0.1.0"
description = "xbrain MCP Gateway — routes MCP tool calls to registered sidecars with team_scope injection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.4.0",
    "authlib>=1.3.0",
    "structlog>=25.0.0",
    "pydantic-settings>=2.0.0",
    # Upper bound is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp`,
    # which crash-loops this service on ModuleNotFoundError at its next
    # rebuild. Caught on mcp-scraper 2026-08-06 (260806-5zq).
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[project]
name = "agent-runtime"
version = "0.1.0"
description = "xbrain LangGraph agent runtime — hosts agents with PostgresSaver + HITL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6",
  "langgraph>=1.1",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.28",
  "authlib>=1.3",
  "structlog>=24.4",
  "tenacity>=9.0",
  "anthropic>=0.40",
  "openai>=1.55",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

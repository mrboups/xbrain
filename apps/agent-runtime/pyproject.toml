[project]
name = "agent-runtime"
version = "0.1.0"
description = "xbrain LangGraph agent runtime — hosts agents with PostgresSaver + HITL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6",
  "langgraph>=1.1",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.28",
  # Ceiling load-bearing: authlib 2.0 removes `authlib.jose`, which the
  # bridge-JWT verify (and the Centrifugo token mint) import. Same failure
  # class as the mcp 2.0 crash-loop of 2026-08-06 — bounded before it lands.
  "authlib>=1.3,<2.0.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "anthropic>=0.40",
  "openai>=1.55",
  "pypdf>=5.0",  # 02-07 ingestion-agent — PDF text extraction
  "langfuse>=2.55,<3",  # 02-09 observability — v2 line still ships LangChain CallbackHandler at langfuse.callback
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

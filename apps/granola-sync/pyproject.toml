[project]
name = "granola-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "structlog>=25.0.0",
    "cryptography>=42.0.0",
    "authlib>=1.3.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.50.0",
    "xbrain-memory",  # shared package -- needs repo-root build context
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

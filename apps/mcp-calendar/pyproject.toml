[project]
name = "mcp-calendar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp`,
    # which crash-loops this service on ModuleNotFoundError at its next
    # rebuild. Caught on mcp-scraper 2026-08-06 (260806-5zq).
    "mcp>=1.27.0,<2.0.0",
    "google-api-python-client>=2.195.0",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.2.0",
    "structlog>=25.0.0",
]

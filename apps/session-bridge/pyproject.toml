[project]
name = "session-bridge"
version = "0.1.0"
description = "xbrain Phase 9 — bridges LibreChat HTTP/SSE to a user's Chrome extension via WebSocket, routing chat traffic through their Claude Pro/Max subscription."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.4",
    "websockets>=12.0",
    # Ceiling load-bearing: authlib 2.0 removes `authlib.jose`, which the
    # bridge-JWT verify (and the Centrifugo token mint) import. Same failure
    # class as the mcp 2.0 crash-loop of 2026-08-06 — bounded before it lands.
    "authlib>=1.3,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx-ws>=0.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

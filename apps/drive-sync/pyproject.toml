[project]
name = "drive-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.195.0",
    "google-auth-oauthlib>=1.3.1",
    "google-auth-httplib2>=0.2.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "structlog>=25.0.0",
    "pypdf>=5.0.0",
    "cryptography>=42.0.0",
    # Ceiling load-bearing: authlib 2.0 removes `authlib.jose`, which the
    # bridge-JWT verify (and the Centrifugo token mint) import. Same failure
    # class as the mcp 2.0 crash-loop of 2026-08-06 — bounded before it lands.
    "authlib>=1.3.0,<2.0.0",
    "pydantic-settings>=2.6",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "xbrain-memory",  # shared package -- needs repo-root build context
]

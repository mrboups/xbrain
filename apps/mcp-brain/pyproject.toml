[project]
name = "mcp-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp`,
    # which crash-loops this service on ModuleNotFoundError at its next
    # rebuild. Caught on mcp-scraper 2026-08-06 (260806-5zq).
    "mcp>=1.27.0,<2.0.0",
    "httpx>=0.28.0",
    "structlog>=25.0.0",
    "pydantic-settings>=2.0.0",
    # Ceiling load-bearing: authlib 2.0 removes `authlib.jose`, which the
    # bridge-JWT verify (and the Centrifugo token mint) import. Same failure
    # class as the mcp 2.0 crash-loop of 2026-08-06 — bounded before it lands.
    "authlib>=1.3.0,<2.0.0",
    "uvicorn>=0.30.0",
]

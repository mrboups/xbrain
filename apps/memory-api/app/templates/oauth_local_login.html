<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to authorize</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f1115; color: #e7e9ee; margin: 0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #181b22; border: 1px solid #2a2e38; border-radius: 12px;
            padding: 32px; max-width: 440px; width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #aab0bd; font-size: 14px; line-height: 1.5; }
    .app { font-weight: 600; color: #fff; }
    label.field { display: block; font-size: 13px; color: #c7ccd6; margin: 16px 0 6px; }
    input[type=email], input[type=password] {
            width: 100%; box-sizing: border-box; padding: 10px 12px;
            background: #11141a; border: 1px solid #2a2e38; border-radius: 8px;
            color: #e7e9ee; font-size: 14px; }
    input:focus { outline: none; border-color: #3b6fe0; }
    .error { background: #2a1416; border: 1px solid #5c2a2f; color: #f2b8bd;
             border-radius: 8px; padding: 10px 12px; margin: 16px 0 0; font-size: 13px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px;
             background: #3b6fe0; color: #fff; font-size: 15px; font-weight: 600;
             cursor: pointer; margin-top: 20px; }
    button:hover { background: #2f5fcc; }
    .foot { font-size: 12px; color: #6b7280; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to authorize {{client_name}}</h1>
    <p><span class="app">{{client_name}}</span> is requesting access to your team brain.
       Sign in with your email and password to continue.</p>
    {{error}}
    <form method="post" action="/oauth/authorize/local">
      <input type="hidden" name="state" value="{{state}}">
      <label class="field" for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      <label class="field" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in and continue</button>
    </form>
    <p class="foot">You can revoke this connection at any time from your account settings.</p>
  </div>
</body>
</html>

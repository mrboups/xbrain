[project]
name = "memory-api"
version = "0.1.0"
description = "xbrain memory-api — tagging contract + team-scope enforcement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "qdrant-client>=1.17",
  # Ceiling load-bearing: authlib 2.0 removes `authlib.jose`, which the
  # bridge-JWT verify (and the Centrifugo token mint) import. Same failure
  # class as the mcp 2.0 crash-loop of 2026-08-06 — bounded before it lands.
  "authlib>=1.3,<2.0.0",
  "httpx>=0.28",
  "python-multipart>=0.0.18",
  "structlog>=24.4",
  "openai>=1.55",  # Phase 2: embeddings for NativeProvider
  "mem0ai>=1.0.4",  # Phase 2: optional Mem0Provider backend (lazy-imported)
  "neo4j>=6.1.0",  # Phase 3: async graph driver (lazy-imported; graceful degrade if NEO4J_URI unset)
  "cryptography>=42.0.0",  # Phase 3 plan 03-10: Fernet encryption for OAuth credentials at rest
  "PyJWT[crypto]>=2.10,<3",  # Phase 12 plan 12-02: GitHub App JWT signing (RS256). cryptography>=42 already present.
  "aiosmtplib>=3.0.0",   # Phase 7 plan 07-06: async SMTP for task notifications
  "anthropic>=0.50.0",   # Phase 7 plan 07-06: Claude (Haiku) for CRM contact + task extraction
  "boto3>=1.35",  # Phase 11 plan 11-10: MinIO/S3 client for superadmin storage metrics (lazy-imported)
  "motor>=3.6",   # superadmin wipe-database: drop LibreChat Mongo DB (lazy-imported)
  "minio>=7.2",   # superadmin wipe-database: clear MinIO xbrain-decks bucket (lazy-imported)
  "argon2-cffi>=25.1.0",  # Phase 18 plan 18-02: argon2id local-auth password hashing (D-18-04)
  "limits>=5.8.0",  # Phase 18 plan 18-02: in-process rate limiting for local-auth routes (D-18-06)
  "fastembed>=0.8.0",  # Phase 19: local keyless embeddings (ONNX via onnxruntime, no torch)
  "pypdf>=5.1",         # Phase 24 (DOCBODY-01): PDF text-layer extraction (pure-Python, py3-none-any wheel)
  "python-docx>=1.1",   # Phase 24 (DOCBODY-01): DOCX paragraph text extraction (pulls lxml; both runtime arches ship cp312 wheels — proven in 24-01-SUMMARY)
  "pywebpush>=2.3,<3",  # Phase 27 (PUSH-01): VAPID + aes128gcm payload encryption. pywebpush and
                        # py-vapid ship py3-none-any wheels; http-ece is sdist-only but pure Python
                        # (builds to py3-none-any on any arch) — proven in 27-03-SUMMARY. py-vapid
                        # raises the resolved cryptography floor to >=46; PyJWT[crypto] has no ceiling.
  "xbrain-memory @ file:///app/packages/memory-models",  # path mounted in compose build
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
  "testcontainers[postgres,qdrant]>=4.8",
  "respx>=0.21",
  # IN-01: test_ci_lockstep_graph.py parses the CI workflow with PyYAML. It resolved only by
  # accident until now (fastembed -> huggingface_hub -> pyyaml); declare it so the SC3 graph
  # proof cannot silently stop collecting if that transitive chain ever changes.
  "pyyaml>=6.0",
  "reportlab>=4.2",     # Phase 24 gate (24-03): generate real PDFs (with + without a text layer) for the integration proof; DEV-ONLY, never imported at runtime
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

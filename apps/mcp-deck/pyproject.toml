[project]
name = "mcp-deck"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed `mcp.server.fastmcp`,
    # which crash-loops this service on ModuleNotFoundError at its next
    # rebuild. Caught on mcp-scraper 2026-08-06 (260806-5zq).
    "mcp>=1.27.0,<2.0.0",
    "python-pptx>=1.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "structlog>=24.0",
    "authlib>=1.3",
    "uvicorn>=0.29",
]

# apps/board-web/nginx.conf — static host for the built board SPA.
#
# Serves the Vite bundle from /usr/share/nginx/html on port 8107 with an SPA
# fallback to index.html. The security headers below back the fragment-handoff
# design in session.ts: Referrer-Policy: no-referrer is a second, independent
# guarantee that the one-time board token can never leak outward in a Referer
# header. X-Frame-Options is SAMEORIGIN (not DENY): the board is its own
# top-level page, and SAMEORIGIN is the correct posture here.
#
# This container is NOT a second route to the realtime WebSocket. Sending that
# socket to the Hocuspocus container is the ingress nginx's job (26-06);
# duplicating it here would create a second, undocumented path to it.

server {
    listen 8107;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on the document (inherited by the SPA-fallback location,
    # which sets no headers of its own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Plain HTTP health probe for the compose healthcheck.
    location = /healthz {
        return 200 "ok\n";
        access_log off;
        add_header Content-Type text/plain;
    }

    # Long cache on the content-hashed asset directory.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry document, so a new deploy is picked up immediately.
    # This location sets its own add_header, so the security headers are repeated
    # here (nginx does not merge inherited add_header once a level defines one).
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA fallback: unknown paths resolve to the app entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

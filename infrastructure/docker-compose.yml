# Phase 1 — squelette docker-compose
# Étoffé incrémentalement par plans 01-02 → 01-06
# Points d'entrée : nginx (80/443), tout le reste interne sur xbrain_net.

# Default logging caps per container so no service can fill the VM disk again
# (past incident: clickhouse 17 GB single JSON log file).
# 100 MB × 3 rotated files = 300 MB max per container.
# Override per-service by replacing `logging: *default-logging` with a custom
# block if a service legitimately needs more retention.
x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

networks:
  xbrain_net:
    name: xbrain_net
    driver: bridge

volumes:
  xbrain_pg: { name: xbrain_pg }
  xbrain_qdrant: { name: xbrain_qdrant }
  librechat_mongo: { name: librechat_mongo }
  librechat_meili: { name: librechat_meili }
  librechat_uploads: { name: librechat_uploads }
  openwebui_data: { name: openwebui_data }
  openwebui_pipelines: { name: openwebui_pipelines }
  xbrain_backups: { name: xbrain_backups }
  langfuse_clickhouse_data: { name: langfuse_clickhouse_data }
  langfuse_redis_data: { name: langfuse_redis_data }
  langfuse_minio_data: { name: langfuse_minio_data }
  neo4j_data: { name: neo4j_data }

services:
  # === Placeholder ingress (nginx) — détails dans plan 01-05 ===
  nginx:
    image: nginx:1.27-alpine
    container_name: xbrain-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      XBRAIN_BASE_DOMAIN: ${XBRAIN_BASE_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: "^XBRAIN_"
    networks: [xbrain_net]
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health 2>/dev/null | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # === Data layer (plan 01-02) ===
  postgres:
    image: postgres:17
    container_name: xbrain-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - xbrain_pg:/var/lib/postgresql/data
    networks: [xbrain_net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: xbrain-qdrant
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - xbrain_qdrant:/qdrant/storage
    networks: [xbrain_net]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === memory-api (plan 01-02) ===
  memory-api:
    build:
      context: ..   # repo root (so packages/memory-models is in the build context)
      dockerfile: apps/memory-api/Dockerfile
    image: xbrain/memory-api:phase2
    container_name: xbrain-memory-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # Memory backend: "native" = real PG memory_items + Qdrant embeddings.
      # Default native so the searchable brain actually persists — the prior
      # implicit "stub" default was an in-process no-op, which is why Qdrant
      # stayed at 0 points and no frontend could retrieve memory. Embeddings
      # use OpenAI text-embedding-3-small (OPENAI_API_KEY required).
      MEMORY_BACKEND: ${MEMORY_BACKEND:-native}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USER_SUBS: ${ADMIN_USER_SUBS:-}
      # Phase 3: Neo4j graph sync (optional — graceful degrade if not set)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Phase 3 plan 03-10: Drive OAuth config
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_CREDENTIALS_ENCRYPTION_KEY: ${OAUTH_CREDENTIALS_ENCRYPTION_KEY:-}
      MEMORY_API_EXTERNAL_URL: ${MEMORY_API_EXTERNAL_URL:-https://chat.grooveos.app}
      # Phase 5 plan 05-01: Graphiti enrichment (fail-soft if not set)
      GRAPHITI_SERVICE_URL: ${GRAPHITI_SERVICE_URL:-http://graphiti-service:8300}
      # Phase 5 plan 05-02: GitHub OAuth membership verification
      # GITHUB_API_PAT was removed by Plan 12-04 — installation tokens
      # minted from the GitHub App replace the long-lived PAT.
      GITHUB_ORG: ${GITHUB_ORG:-}
      # Phase 10: GitHub-primary auth — POST /v1/auth/github/signin code-exchanges
      # server-side. client_secret stays in memory-api; never reaches frontend.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Phase 12: GitHub App — minted installation tokens replace GITHUB_API_PAT.
      # All 5 secrets are required server-side only; never exposed to frontends.
      # See apps/memory-api/app/config.py for full var purpose docstrings.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-xbrain}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # github-read stopgap: user OAuth token used when the App isn't installed
      GITHUB_FALLBACK_TOKEN: ${GITHUB_FALLBACK_TOKEN:-}
      # Waitlist email proxy (grooveos.app landing page)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WAITLIST_TO: ${WAITLIST_TO:-team@grooveos.app}
      WAITLIST_FROM: ${WAITLIST_FROM:-GrooveOS <waitlist@grooveos.app>}
      # Phase 8: Granola per-user key encryption + GitHub repos proxy
      FERNET_KEY: ${FERNET_KEY:-${OAUTH_CREDENTIALS_ENCRYPTION_KEY}}
      LIBRECHAT_INTERNAL_URL: ${LIBRECHAT_INTERNAL_URL:-http://librechat:3080}
      # Phase 7 — Anthropic SDK fallback when @claude mentioner has no Pro/Max bridge.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Phase 13 — Haiku relevance filter + brain ingest knobs.
      RELEVANCE_HAIKU_ENABLED: ${RELEVANCE_HAIKU_ENABLED:-true}
      RELEVANCE_HAIKU_MODEL: ${RELEVANCE_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      RELEVANCE_HAIKU_TIMEOUT_S: ${RELEVANCE_HAIKU_TIMEOUT_S:-3.0}
      RELEVANCE_DAILY_TOKEN_CAP_PER_TEAM: ${RELEVANCE_DAILY_TOKEN_CAP_PER_TEAM:-50000}
      BRAIN_INGEST_ENABLED: ${BRAIN_INGEST_ENABLED:-true}
      # GitHub repo-catalog (quick 260607-267) — safe code defaults, no .env change required.
      GITHUB_CATALOG_ENABLED: ${GITHUB_CATALOG_ENABLED:-true}
      GITHUB_CATALOG_CONCURRENCY: ${GITHUB_CATALOG_CONCURRENCY:-5}
      GITHUB_CATALOG_README_CHARS: ${GITHUB_CATALOG_README_CHARS:-8000}
      # Quick task 260512-tcr — team chat realtime via Centrifugo.
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-}
      CENTRIFUGO_HTTP_URL_INTERNAL: ${CENTRIFUGO_HTTP_URL_INTERNAL:-http://centrifugo:8000}
      CENTRIFUGO_WS_URL_PUBLIC: ${CENTRIFUGO_WS_URL_PUBLIC:-wss://centrifugo.grooveos.app/connection/websocket}
      # Superadmin wipe-database: drop LibreChat Mongo DB + clear MinIO xbrain-decks bucket.
      LIBRECHAT_MONGO_URI: ${LIBRECHAT_MONGO_URI:-mongodb://librechat-mongo:27017/LibreChat}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-langfuse-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_DECKS_BUCKET: ${MINIO_DECKS_BUCKET:-xbrain-decks}
      # BL-003 slice 1 — reconcile get_minio_client() vars with the MinIO creds above.
      # get_minio_client() reads MINIO_URL/ACCESS_KEY/SECRET_KEY; the deck path and MinIO
      # container use MINIO_ENDPOINT/ROOT_USER/ROOT_PASSWORD. Map them here so a single
      # MinIO instance serves both the decks path and the new media endpoints.
      MINIO_URL: ${MINIO_URL:-http://${MINIO_ENDPOINT:-langfuse-minio:9000}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MINIO_BUCKET: ${MINIO_MEDIA_BUCKET:-xbrain-media}
      # Quick task 260604-glo — OAuth 2.1 AS (Claude.ai Custom Connector).
      # OAUTH_ISSUER_URL = public base for AS metadata + /oauth/* endpoints.
      # OAUTH_RESOURCE_URL = mcp-brain audience the issued tokens are bound to.
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://api.grooveos.app}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:-https://mcp.grooveos.app/mcp}
    networks: [xbrain_net]
    # 384m was the Phase 1 (e2-medium 4GB) budget. The signin path (PyJWT
    # RS256 + GitHub token exchange + profile fetch + DB writes) pushed RSS
    # past the cap → uvicorn worker OOM-killed mid-request → 502 at the edge.
    # VM is now 8GB with headroom; 768m removes the OOM churn.
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # === agent-runtime (plan 02-06) — LangGraph host with PostgresSaver + HITL ===
  agent-runtime:
    build:
      context: ../apps/agent-runtime
      dockerfile: Dockerfile
    image: xbrain/agent-runtime:phase2
    container_name: xbrain-agent-runtime
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEMORY_API_URL: ${MEMORY_API_URL:-http://memory-api:8000}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000   # internal docker DNS — bypass Cloudflare for SDK calls
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-http://mcp-gateway:8080}
      MCP_TOOL_CACHE_TTL_SECS: ${MCP_TOOL_CACHE_TTL_SECS:-300}
    networks: [xbrain_net]
    mem_limit: 384m
    depends_on:
      memory-api: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === librechat-bridge sidecar (plan 01-03) ===
  librechat-bridge:
    build:
      context: ../apps/librechat-bridge
      dockerfile: Dockerfile
    image: xbrain/librechat-bridge:phase1
    container_name: xbrain-librechat-bridge
    restart: unless-stopped
    logging: *default-logging
    environment:
      LIBRECHAT_MONGO_URI: ${LIBRECHAT_MONGO_URI}
      MEMORY_API_URL: ${MEMORY_API_URL}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      BRIDGE_DEFAULT_TEAM_SCOPE: ${BRIDGE_DEFAULT_TEAM_SCOPE:-default}
      BRIDGE_BACKFILL_FROM: ${BRIDGE_BACKFILL_FROM:-startup}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TASK_INTENT_DETECTION: ${TASK_INTENT_DETECTION:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_TASK_INTENT_MODEL: ${ANTHROPIC_TASK_INTENT_MODEL:-claude-3-5-haiku-20241022}
      # Phase 13 — brain ingest + per-turn enrichment for LibreChat
      BRAIN_INGEST_ENABLED: ${BRAIN_INGEST_ENABLED:-true}
      CHAT07_TOP_K: ${CHAT07_TOP_K:-5}
      CHAT07_TRUTH_FILTER_MIN_LEVEL: ${CHAT07_TRUTH_FILTER_MIN_LEVEL:-WORKING}
    networks: [xbrain_net]
    mem_limit: 128m
    depends_on:
      memory-api: { condition: service_healthy }
      librechat-mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bridge-alive && [ $(($(date +%s) - $(stat -c %Y /tmp/bridge-alive))) -lt 60 ]"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # === openwebui-pipeline (plan 01-04) ===
  openwebui-pipeline:
    build:
      context: ../apps/openwebui-pipeline
      dockerfile: Dockerfile
    image: xbrain/openwebui-pipeline:phase1
    container_name: xbrain-openwebui-pipeline
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEMORY_API_URL: ${MEMORY_API_URL}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PIPELINE_API_KEY: ${PIPELINE_API_KEY}
      PIPELINE_DEFAULT_TEAM_SCOPE: ${PIPELINE_DEFAULT_TEAM_SCOPE:-default}
      AGENT_RUNTIME_URL: ${AGENT_RUNTIME_URL:-http://agent-runtime:9100}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000   # internal docker DNS — bypass Cloudflare for SDK calls
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Phase 13 — brain ingest + per-turn enrichment for Open WebUI
      BRAIN_INGEST_ENABLED: ${BRAIN_INGEST_ENABLED:-true}
      CHAT07_TOP_K: ${CHAT07_TOP_K:-5}
      CHAT07_TRUTH_FILTER_MIN_LEVEL: ${CHAT07_TRUTH_FILTER_MIN_LEVEL:-WORKING}
    # Phase 13 — expose pipeline on host loopback so verify-phase13.sh test (c)
    # can curl it; not bound to the public iface, only 127.0.0.1.
    ports:
      - "127.0.0.1:8200:9099"
    networks: [xbrain_net]
    mem_limit: 192m
    depends_on:
      memory-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9099/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # === LibreChat + dependencies (plan 01-05) ===
  librechat-mongo:
    image: mongo:7
    container_name: xbrain-librechat-mongo
    restart: unless-stopped
    logging: *default-logging
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - librechat_mongo:/data/db
      - ./scripts/init-mongo-replset.sh:/docker-entrypoint-initdb.d/init-replset.sh:ro
    networks: [xbrain_net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok ? 0 : 1 } catch(e) { 1 }"]
      # timeout was 5s — mongosh cold-start + rs.status() exceeds it on the
      # 512m-limited VM, flapping the container to "unhealthy" (which then blocks
      # `compose up` of dependents like librechat-bridge via depends_on). Mongo
      # itself is fine; the probe was just too tight. Wider timeout + less-frequent
      # interval reduces probe load and stops the flap.
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 40s

  librechat-meili:
    image: getmeili/meilisearch:v1.10
    container_name: xbrain-librechat-meili
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - librechat_meili:/meili_data
    networks: [xbrain_net]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health 2>/dev/null | grep -q available"]
      interval: 15s
      timeout: 5s
      retries: 5

  # === SearXNG (Quick 260601-uom) — self-hosted meta-search backing LibreChat web search ===
  # Internal-only (no nginx vhost). LibreChat calls its JSON API; settings.yml enables the
  # `json` format + disables the limiter (infrastructure/searxng/settings.yml). The secret_key
  # is injected from $SEARXNG_SECRET by the image entrypoint — nothing secret is committed.
  searxng:
    image: searxng/searxng:latest
    container_name: xbrain-searxng
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    networks: [xbrain_net]
    mem_limit: 384m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  librechat:
    build:
      context: ../apps/librechat
      dockerfile: Dockerfile
    image: xbrain/librechat:phase8g
    container_name: xbrain-librechat
    restart: unless-stopped
    logging: *default-logging
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: ${MONGO_URI}
      DOMAIN_CLIENT: ${DOMAIN_CLIENT}
      DOMAIN_SERVER: ${DOMAIN_SERVER}
      MEILI_HOST: ${MEILI_HOST}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_SOCIAL_LOGIN: ${ALLOW_SOCIAL_LOGIN:-true}
      ALLOW_SOCIAL_REGISTRATION: ${ALLOW_SOCIAL_REGISTRATION:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      # Phase 5 plan 05-02: GitHub OAuth (parallel to Google — both providers active)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-/oauth/github/callback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      APP_TITLE: ${APP_TITLE:-xbrain}
      SESSION_EXPIRY: ${SESSION_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      LIBRECHAT_DEFAULT_TEAM_SCOPE: ${LIBRECHAT_DEFAULT_TEAM_SCOPE:-default}
      # Phase 8: bridge JWT for onboarding modal token endpoint
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      # BL-003 slice 5: media proxy needs the internal memory-api URL to call /raw + resolve-team-scope
      MEMORY_API_URL: ${MEMORY_API_URL:-http://memory-api:8000}
      # Allow frequent OAuth logins (default 7/5min is too tight for multi-provider testing)
      LOGIN_MAX: ${LOGIN_MAX:-50}
      LOGIN_WINDOW: ${LOGIN_WINDOW:-1}
    volumes:
      - librechat_uploads:/app/client/public/uploads
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
    networks: [xbrain_net]
    mem_limit: 384m
    depends_on:
      librechat-mongo: { condition: service_healthy }
      librechat-meili: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # === Open WebUI (plan 01-05) ===
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.9.0
    container_name: xbrain-openwebui
    restart: unless-stopped
    logging: *default-logging
    environment:
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP:-true}
      ENABLE_LOGIN_FORM: "false"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-Google}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${PIPELINE_API_KEY}
      WEBUI_URL: https://adm.grooveos.app
    volumes:
      - openwebui_data:/app/backend/data
    networks: [xbrain_net]
    mem_limit: 1280m
    depends_on:
      openwebui-pipeline: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  # === xbrain-backup (plan 01-06) ===
  xbrain-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: xbrain/backup:phase1
    container_name: xbrain-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      LIBRECHAT_MONGO_URI: ${LIBRECHAT_MONGO_URI}
      QDRANT_URL: ${QDRANT_URL}
      GCS_BACKUP_BUCKET: ${GCS_BACKUP_BUCKET}
      # GCS auth via VM-attached service account (metadata server, no key file)
      # Forced by org policy iam.disableServiceAccountKeyCreation
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
    volumes:
      - openwebui_data:/backup-volumes/openwebui-data:ro
      - librechat_uploads:/backup-volumes/librechat-uploads:ro
      - librechat_meili:/backup-volumes/librechat-meili:ro
    networks: [xbrain_net]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      librechat-mongo: { condition: service_healthy }

  # === Langfuse stack (plan 02-09) — observability for agents + chat completions ===
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: xbrain-langfuse-clickhouse
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    networks: [xbrain_net]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  langfuse-redis:
    image: redis:7-alpine
    container_name: xbrain-langfuse-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}"]
    volumes:
      - langfuse_redis_data:/data
    networks: [xbrain_net]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # === Langfuse MinIO (S3-compat for event/media uploads, mandatory in Langfuse v3) ===
  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: xbrain-langfuse-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    networks: [xbrain_net]
    mem_limit: 384m
    entrypoint: /bin/sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: xbrain-langfuse-worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${LANGFUSE_POSTGRES_URL}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
    networks: [xbrain_net]
    mem_limit: 768m
    depends_on:
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }

  langfuse:
    image: langfuse/langfuse:3
    container_name: xbrain-langfuse
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${LANGFUSE_POSTGRES_URL}
      NEXTAUTH_URL: ${LANGFUSE_HOST:-https://lang.grooveos.app}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_INIT_ORG_ID: xbrain
      LANGFUSE_INIT_ORG_NAME: xbrain
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-team@grooveos.app}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-xbrain admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-xbrain}
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=900"
      HOSTNAME: "0.0.0.0"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
    networks: [xbrain_net]
    mem_limit: 1152m
    depends_on:
      langfuse-worker: { condition: service_started }
      langfuse-minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/public/health 2>/dev/null | grep -qi ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # === Neo4j Community (plan 03-01) — graph store for entity/fact relationships ===
  neo4j:
    image: neo4j:2026.04.0-community
    container_name: xbrain-neo4j
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: "[]"
    volumes:
      - neo4j_data:/data
    networks: [xbrain_net]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 2>/dev/null | grep -q neo4j || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # === mcp-gateway (plan 03-06) — MCP tool call router with team_scope injection ===
  # Plain FastAPI proxy — NOT a FastMCP host (issue #1367 prevents mounting FastMCP in parent FastAPI).
  # Tool sidecars (mcp-scraper, mcp-drive-read, mcp-calendar) run as standalone processes.
  mcp-gateway:
    build:
      context: ../apps/mcp-gateway
      dockerfile: Dockerfile
    image: xbrain/mcp-gateway:phase4
    container_name: xbrain-mcp-gateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEMORY_API_URL: http://memory-api:8000
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # MCP aggregate server (port 8081) — subprocess inside mcp-gateway container
      GATEWAY_INTERNAL_URL: "http://127.0.0.1:8080"
      FASTMCP_AGGREGATE_HOST: "0.0.0.0"
      FASTMCP_AGGREGATE_PORT: "8081"
      MCP_AGGREGATE_REFRESH_SECS: "60"
    expose:
      - "8081"
    networks: [xbrain_net]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
      memory-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # === mcp-scraper (plan 03-07) — MCP tool: URL -> text ===
  mcp-scraper:
    build:
      context: ../apps/mcp-scraper
      dockerfile: Dockerfile
    image: xbrain/mcp-scraper:phase3
    container_name: xbrain-mcp-scraper
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8100"
    networks: [xbrain_net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8100/healthz 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === mcp-drive-read (plan 03-08) — MCP tool: Drive file read/write ===
  mcp-drive-read:
    build:
      context: ../apps/mcp-drive-read
      dockerfile: Dockerfile
    image: xbrain/mcp-drive-read:phase3
    container_name: xbrain-mcp-drive-read
    restart: unless-stopped
    logging: *default-logging
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_ACCESS_TOKEN: ${GOOGLE_DRIVE_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8101"
    networks: [xbrain_net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8101/healthz 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === mcp-calendar (plan 03-09) — MCP tool: Google Calendar read-only ===
  mcp-calendar:
    build:
      context: ../apps/mcp-calendar
      dockerfile: Dockerfile
    image: xbrain/mcp-calendar:phase3
    container_name: xbrain-mcp-calendar
    restart: unless-stopped
    logging: *default-logging
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ACCESS_TOKEN: ${GOOGLE_CALENDAR_ACCESS_TOKEN:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8102"
    networks: [xbrain_net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8102/healthz 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === mcp-deck (plan 04-07) — MCP tool: PowerPoint generator via python-pptx + MinIO ===
  mcp-deck:
    build:
      context: ../apps/mcp-deck
      dockerfile: Dockerfile
    image: xbrain/mcp-deck:phase4
    container_name: xbrain-mcp-deck
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ENDPOINT: langfuse-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DECKS: ${MINIO_BUCKET_DECKS:-xbrain-decks}
      MINIO_USE_SSL: "false"
      MEMORY_API_URL: http://memory-api:8000
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8103"
    networks: [xbrain_net]
    mem_limit: 192m
    depends_on:
      memory-api: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8103/healthz 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === mcp-brain (Phase 8 remote) — MCP server for Claude.ai + ChatGPT web ===
  mcp-brain:
    build:
      context: ../apps/mcp-brain
      dockerfile: Dockerfile
    image: xbrain/mcp-brain:phase8
    container_name: xbrain-mcp-brain
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEMORY_API_URL: http://memory-api:8000
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8104"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tokenless email path — LibreChat forwards user email + this secret so mcp-brain
      # can resolve the team without requiring a per-user xbt_ token. Public callers
      # (ChatGPT/Claude.ai) come through nginx without this secret → token path only.
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      # Quick task 260604-glo — Claude.ai Custom Connector (Protected Resource).
      # mcp-brain validates oat_ tokens by introspecting against memory-api,
      # presenting BRIDGE_SHARED_SECRET as X-Internal-Secret. OAUTH_ISSUER_URL +
      # OAUTH_RESOURCE_URL back the protected-resource metadata + audience check.
      MEMORY_API_OAUTH_INTROSPECT_URL: ${MEMORY_API_OAUTH_INTROSPECT_URL:-http://memory-api:8000/oauth/introspect}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-https://api.grooveos.app}
      OAUTH_RESOURCE_URL: ${OAUTH_RESOURCE_URL:-https://mcp.grooveos.app/mcp}
    expose:
      - "8104"
    networks: [xbrain_net]
    mem_limit: 128m
    depends_on:
      memory-api: { condition: service_healthy }
    healthcheck:
      # python:3.11-slim has no `nc` and no bash /dev/tcp — use stdlib socket probe.
      # FastMCP's /mcp endpoint requires POST + special headers; /healthz isn't exposed.
      # A successful TCP connect proves uvicorn bound the port.
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8104)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === mcp-github (github-read phase 1) — MCP sidecar for GitHub repo read ===
  # Thin proxy: mints bridge JWT, calls memory-api /v1/internal/github/{list,read}.
  # The GitHub App private key stays in memory-api; this container holds no secrets.
  # Requires the GitHub App to have contents:read granted (see feature doc).
  mcp-github:
    build:
      context: ../apps/mcp-github
      dockerfile: Dockerfile
    image: xbrain/mcp-github:phase1
    container_name: xbrain-mcp-github
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEMORY_API_URL: http://memory-api:8000
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8107"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [xbrain_net]
    mem_limit: 128m
    depends_on:
      memory-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8107)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # === session-bridge (Phase 9) — Pro/Max routing via Chrome extension ===
  # Bridges LibreChat HTTP /v1/chat/completions to a per-user WebSocket from
  # the xbrain Chrome extension. Validates xbt_ tokens via memory-api, signs a
  # bridge JWT (BRIDGE_SHARED_SECRET) to upsert user_external_sessions on
  # extension `register` frames. Single-instance (in-memory WS pool); fronted
  # by nginx vhost bridge.grooveos.app (plan 09-04).
  session-bridge:
    build:
      context: ../apps/session-bridge
      dockerfile: Dockerfile
    image: xbrain/session-bridge:phase9
    container_name: xbrain-session-bridge
    restart: unless-stopped
    logging: *default-logging
    environment:
      MEMORY_API_URL: http://memory-api:8000
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: HS256
      LOG_LEVEL: ${SESSION_BRIDGE_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8105:8105"
    depends_on:
      memory-api:
        condition: service_healthy
    networks: [xbrain_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8105/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === centrifugo (quick task 260512-tcr) — realtime WS broker for team chat ===
  # MIT-licensed Go binary. Channels `team:<id>` (broadcast) + `user:<sub>` (Phase 2).
  # JWT auth via CENTRIFUGO_TOKEN_HMAC_SECRET, server-side publish via CENTRIFUGO_API_KEY.
  # Fronted by nginx vhost centrifugo.grooveos.app.
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: xbrain-centrifugo
    restart: unless-stopped
    logging: *default-logging
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ../infrastructure/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      # Centrifugo v6 env var names — overlay config.json keys.
      # Maps our project env names (CENTRIFUGO_TOKEN_HMAC_SECRET / CENTRIFUGO_API_KEY)
      # to the path-derived var names Centrifugo expects.
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
    ports:
      - "127.0.0.1:8106:8000"
    networks: [xbrain_net]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === graphiti-service (plan 05-01) — temporal fact extraction + contradiction detection ===
  graphiti-service:
    build:
      context: ../apps/graphiti-service
      dockerfile: Dockerfile
    image: xbrain/graphiti-service:phase5
    container_name: xbrain-graphiti-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${GRAPHITI_LLM_MODEL:-claude-haiku-4-5-20251001}
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8300:8300"
    networks: [xbrain_net]
    mem_limit: 512m
    depends_on:
      neo4j: { condition: service_healthy }
      memory-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/v1/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # === drive-sync (plan 03-11) — incremental Google Drive sync sidecar ===
  # Polls Google Drive changes.list every DRIVE_SYNC_POLL_INTERVAL seconds.
  # Delegates extraction to agent-runtime ingestion-agent (plan 02-07).
  # Build context is repo root to access packages/memory-models.
  drive-sync:
    build:
      context: ..   # repo root -- needs packages/memory-models
      dockerfile: apps/drive-sync/Dockerfile
    image: xbrain/drive-sync:phase3
    container_name: xbrain-drive-sync
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEMORY_API_URL: http://memory-api:8000
      AGENT_RUNTIME_URL: http://agent-runtime:9100
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_CREDENTIALS_ENCRYPTION_KEY: ${OAUTH_CREDENTIALS_ENCRYPTION_KEY:-}
      DRIVE_WEBHOOK_PUBLIC_URL: ${DRIVE_WEBHOOK_PUBLIC_URL:-}
      DRIVE_WEBHOOK_SECRET: ${DRIVE_WEBHOOK_SECRET:-}
      POLL_INTERVAL_SECONDS: ${DRIVE_SYNC_POLL_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [xbrain_net]
    mem_limit: 192m
    depends_on:
      postgres: { condition: service_healthy }
      memory-api: { condition: service_healthy }
      agent-runtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/drive-sync-alive && [ $(($(date +%s) - $(stat -c %Y /tmp/drive-sync-alive))) -lt 600 ] || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # === granola-sync (plan 07-08) — incremental Granola notes sync sidecar ===
  granola-sync:
    build:
      context: ..
      dockerfile: apps/granola-sync/Dockerfile
    image: xbrain/granola-sync:phase7
    container_name: xbrain-granola-sync
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEMORY_API_URL: http://memory-api:8000
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      FERNET_KEY: ${FERNET_KEY:-${OAUTH_CREDENTIALS_ENCRYPTION_KEY}}
      GRANOLA_POLL_INTERVAL_SECONDS: ${GRANOLA_POLL_INTERVAL_SECONDS:-300}
      GRANOLA_API_BASE: ${GRANOLA_API_BASE:-https://api.granola.ai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [xbrain_net]
    mem_limit: 192m
    depends_on:
      postgres: { condition: service_healthy }
      memory-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/granola-sync-alive && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/granola-sync-alive))) -lt 600 ] || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # === brain-janitor (plan 11-07) — daily 03:00 UTC hard-purge of soft-deleted rows ===
  # Boots, runs one purge cycle immediately (instant verify-phase11 signal), then
  # sleeps until next 03:00 UTC. Touches /tmp/brain-janitor-alive after each cycle;
  # healthcheck reads its mtime and marks the container unhealthy if the daily run
  # hasn't fired in ~25h. RETENTION_DAYS=30 is the contract — see Phase 11 CONTEXT.md.
  brain-janitor:
    build:
      context: ..
      dockerfile: apps/brain-janitor/Dockerfile
    image: xbrain/brain-janitor:phase11
    container_name: xbrain-brain-janitor
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-memory_items}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      RETENTION_DAYS: "30"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [xbrain_net]
    mem_limit: 192m
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/brain-janitor-alive && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/brain-janitor-alive))) -lt 90000 ] || exit 1"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 60s

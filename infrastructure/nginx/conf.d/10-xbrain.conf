# Use Docker's embedded DNS to resolve service names lazily (at request time, not startup)
# This avoids "host not found in upstream" when nginx starts before backend services
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  # Healthcheck nginx (utilisé par docker)
  location /nginx-health { return 200 "ok\n"; access_log off; }

  client_max_body_size 50m;

  # === memory-api API admin (strip /memapi prefix before forwarding) ===
  # Path is /memapi/ (NOT /api/) to avoid collision with LibreChat's own /api/* routes
  location /memapi/ {
    set $memory_api_upstream http://memory-api:8000;
    rewrite ^/memapi/(.*)$ /$1 break;
    proxy_pass $memory_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # === Open WebUI legacy sub-path (/openwebui/) — redirects to sub-domain ===
  # The sub-path approach broke SvelteKit assets (/_app/* paths bypass the prefix).
  # Sub-domain via nip.io wildcard DNS works cleanly.
  location = /openwebui { return 302 http://openwebui.__VM_HOST__.nip.io/; }
  location /openwebui/ { return 302 http://openwebui.__VM_HOST__.nip.io/; }

  # === LibreChat à la racine ===
  location / {
    set $librechat_upstream http://librechat:3080;
    proxy_pass $librechat_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}

# === Open WebUI sub-domain (separate server block, root-mounted) ===
server {
  listen 80;
  server_name openwebui.__VM_HOST__.nip.io;

  client_max_body_size 50m;

  location / {
    set $openwebui_upstream http://openwebui:8080;
    proxy_pass $openwebui_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}

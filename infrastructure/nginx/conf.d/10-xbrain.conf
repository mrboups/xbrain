upstream librechat   { server librechat:3080; }
upstream openwebui   { server openwebui:8080; }
upstream memory_api  { server memory-api:8000; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  # Healthcheck nginx (utilisé par docker)
  location /nginx-health { return 200 "ok\n"; access_log off; }

  client_max_body_size 50m;

  # === memory-api API admin ===
  location /api/ {
    proxy_pass http://memory_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # === Open WebUI sous /openwebui/ ===
  location = /openwebui { return 302 /openwebui/; }
  location /openwebui/ {
    proxy_pass http://openwebui/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /openwebui;

    # WebSocket / SSE pour le streaming des chats
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  # === LibreChat à la racine ===
  location / {
    proxy_pass http://librechat;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE streaming
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}

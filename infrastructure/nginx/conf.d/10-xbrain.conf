# Use Docker's embedded DNS to resolve service names lazily (at request time, not startup)
# This avoids "host not found in upstream" when nginx starts before backend services
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Real client IP from Cloudflare
# CF-Connecting-IP header carries the actual visitor's IP through CF proxy
real_ip_header CF-Connecting-IP;
# Trust Cloudflare's IPv4 ranges (top-level — full list at https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# === LibreChat at x.dejavu.cat ===
server {
  listen 80;
  server_name x.dejavu.cat;

  # Healthcheck nginx (utilisé par docker)
  location /nginx-health { return 200 "ok\n"; access_log off; }

  client_max_body_size 50m;

  # === memory-api API admin (strip /memapi prefix before forwarding) ===
  # Path is /memapi/ (NOT /api/) to avoid collision with LibreChat's own /api/* routes
  location /memapi/ {
    set $memory_api_upstream http://memory-api:8000;
    rewrite ^/memapi/(.*)$ /$1 break;
    proxy_pass $memory_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # === LibreChat à la racine ===
  location / {
    set $librechat_upstream http://librechat:3080;
    proxy_pass $librechat_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
}


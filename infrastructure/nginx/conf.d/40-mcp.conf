# === mcp-brain remote MCP server at mcp.grooveos.app ===
server {
  listen 80;
  server_name mcp.grooveos.app;
  client_max_body_size 2m;

  # CORS preflight
  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Mcp-Session-Id' always;
      add_header 'Access-Control-Max-Age' '86400' always;
      return 204;
    }
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Mcp-Session-Id' always;
    add_header 'Access-Control-Expose-Headers' 'Mcp-Session-Id' always;

    set $mcp_brain_upstream http://mcp-brain:8104;
    proxy_pass $mcp_brain_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Mcp-Session-Id $http_mcp_session_id;
    proxy_read_timeout 120s;
    # SSE / streaming support
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
  }

  location /nginx-health { return 200 "ok\n"; access_log off; }
}

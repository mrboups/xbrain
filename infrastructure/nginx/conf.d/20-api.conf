# === memory-api + drive-sync webhooks at api.grooveos.app ===
# Public API endpoint:
#   /v1/drive-webhook  -> drive-sync:8200/webhook  (Google Drive push notifications)
#   /v1/*              -> memory-api:8001           (all other memory-api routes)
server {
  listen 80;
  server_name api.grooveos.app;

  client_max_body_size 10m;

  # Google Drive push webhook — routed to drive-sync webhook server (port 8200)
  # Google calls this URL when a watched folder changes.
  # Must NOT require auth — Google cannot send a Bearer token here.
  location /v1/drive-webhook {
    set $drive_sync_upstream http://drive-sync:8200;
    rewrite ^/v1/drive-webhook$ /webhook break;
    proxy_pass $drive_sync_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 10s;
  }

  # memory-api — all other /v1/* routes
  location /v1/ {
    set $memory_api_upstream http://memory-api:8000;
    proxy_pass $memory_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # OAuth 2.1 AS metadata discovery (quick-260604-glo). Claude.ai's Custom
  # Connector fetches /.well-known/oauth-authorization-server from browser
  # context. CORS owned by memory-api CORSMiddleware — do NOT add_header ACAO
  # here (duplicate-header CORS failure).
  location /.well-known/ {
    set $memory_api_wk_upstream http://memory-api:8000;
    proxy_pass $memory_api_wk_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # OAuth 2.1 endpoints (register/authorize/token/introspect/revoke).
  # CORS owned by memory-api CORSMiddleware — do NOT add_header ACAO here
  # (duplicate-header CORS failure).
  location /oauth/ {
    set $memory_api_oauth_upstream http://memory-api:8000;
    proxy_pass $memory_api_oauth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  # Health probe
  location /nginx-health { return 200 "ok\n"; access_log off; }
}

# === session-bridge vhost — bridge.grooveos.app (Phase 9) ===
# Cloudflare real-IP and the $connection_upgrade map are declared at the top
# of 10-xbrain.conf and apply globally — they are NOT redeclared here.

# Elide ?token=... from access logs to prevent xbt_ token leakage (T-09-04-01)
map $args $args_redacted {
    default $args;
    "~*(^|&)token=[^&]+"  "token=<REDACTED>";
}

log_format bridge_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri?$args_redacted $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name bridge.grooveos.app;
    client_max_body_size 2m;
    access_log /var/log/nginx/bridge.access.log bridge_access;

    location /nginx-health { return 200 "ok\n"; access_log off; }

    # === WebSocket endpoint for the Chrome extension ===
    location /ws/ {
        set $bridge_upstream http://session-bridge:8105;
        proxy_pass $bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 24h ceiling for long-lived sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # === OpenAI-compat HTTP endpoint for LibreChat ===
    location /v1/ {
        set $bridge_upstream http://session-bridge:8105;
        proxy_pass $bridge_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;

        # SSE streaming — disable buffering at every layer
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Catchall — anything else gets 404
    location / { return 404; }
}

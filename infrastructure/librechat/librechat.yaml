version: 1.2.4
cache: true

interface:
  privacyPolicy:
    externalUrl: ""
    openNewTab: false
  termsOfService:
    externalUrl: ""
    openNewTab: false

registration:
  socialLogins: ["google", "github"]
  allowedDomains:
    - "grooveos.app"
    - "gmail.com"
    # Note: no domain filter for GitHub — org membership is enforced in memory-api (plan 05-02)

# LLM endpoints (API keys are pulled from .env via referenced variables).
endpoints:
  custom:
    - name: "Anthropic"
      apiKey: "${ANTHROPIC_API_KEY}"
      baseURL: "https://api.anthropic.com/v1"
      models:
        default: ["claude-opus-4-7", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"]
        fetch: false
      titleConvo: true
      titleModel: "claude-haiku-4-5-20251001"
      modelDisplayLabel: "Anthropic"

    - name: "OpenAI"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://api.openai.com/v1"
      models:
        default: ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo"]
        fetch: false
      titleConvo: true
      titleModel: "gpt-4o-mini"
      modelDisplayLabel: "OpenAI"

    - name: "xAI"
      apiKey: "${XAI_API_KEY}"
      baseURL: "https://api.x.ai/v1"
      models:
        default: ["grok-3", "grok-2-mini"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Grok"

    - name: "Claude Reasoning"
      apiKey: "${ANTHROPIC_API_KEY}"
      baseURL: "https://api.anthropic.com/v1"
      models:
        default: ["claude-sonnet-4-6"]
        fetch: false
      titleConvo: true
      titleModel: "claude-haiku-4-5-20251001"
      modelDisplayLabel: "Claude Reasoning"

    # Phase 9 — session-bridge route through user's Chrome extension
    # so the user's own Claude Pro/Max subscription quota is consumed.
    # apiKey: user_provided → LibreChat sends what the user pastes as
    # Authorization: Bearer <xbt_token>. session-bridge validates against
    # memory-api /v1/me, looks up the user's WS, relays the chat.
    # NOTE: name must NOT contain "/" — LibreChat routes custom endpoints via
    # /api/.../{name}, so a slash splits the path → "Endpoint not found" and the
    # request never reaches baseURL. Keep the slash only in modelDisplayLabel.
    - name: "Claude Pro Max"
      apiKey: "user_provided"
      baseURL: "https://bridge.grooveos.app/v1"
      models:
        default: ["claude-opus-4-7", "claude-sonnet-4-6"]
        fetch: false
      titleConvo: true
      titleModel: "claude-sonnet-4-6"
      modelDisplayLabel: "Claude Pro/Max"

# Model specs — make the xbrain MCP server active by DEFAULT in every new chat.
# v0.8.5 has no per-conversation "pre-check this tool" flag, so we use modelSpecs:
# each spec attaches `mcpServers: ["xbrain"]`, so selecting it auto-loads the
# xbrain tools (memory_search/add, tasks, contacts, calendar, drive, deck).
# `prioritize: true` + one `default: true` spec → a spec is always pre-selected
# on a fresh conversation, so xbrain is on without any manual toggle.
# `enforce: false` + `addedEndpoints` keep every raw endpoint/model selectable
# too — nothing is removed, the specs are just the curated default path.
# (Passive recall — per-turn CANONICAL/WORKING fact injection via
# librechat-bridge message_enricher — already runs for ALL conversations
# regardless of spec/tool selection; these specs add the ACTIVE tool path.)
modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints:
    - "Anthropic"
    - "OpenAI"
    - "xAI"
    - "Claude Reasoning"
    - "Claude Pro Max"
  list:
    - name: "xbrain-sonnet"
      label: "Claude Sonnet 4.6 · xbrain"
      default: true
      description: "Claude Sonnet with the team brain tools on by default."
      mcpServers: ["xbrain", "xbrain-memory"]
      preset:
        endpoint: "Anthropic"
        model: "claude-sonnet-4-6"

    - name: "xbrain-opus"
      label: "Claude Opus 4.7 · xbrain"
      description: "Claude Opus with the team brain tools on by default."
      mcpServers: ["xbrain", "xbrain-memory"]
      preset:
        endpoint: "Anthropic"
        model: "claude-opus-4-7"

    - name: "xbrain-pro-max"
      label: "Claude Pro/Max · xbrain"
      description: "Routes through your own Claude Pro/Max quota (Chrome extension) with the team brain tools on."
      mcpServers: ["xbrain", "xbrain-memory"]
      preset:
        endpoint: "Claude Pro Max"
        model: "claude-opus-4-7"

    - name: "xbrain-gpt4o"
      label: "GPT-4o · xbrain"
      description: "GPT-4o with the team brain tools on by default."
      mcpServers: ["xbrain", "xbrain-memory"]
      preset:
        endpoint: "OpenAI"
        model: "gpt-4o"

    - name: "xbrain-grok"
      label: "Grok 3 · xbrain"
      description: "Grok 3 with the team brain tools on by default."
      mcpServers: ["xbrain", "xbrain-memory"]
      preset:
        endpoint: "xAI"
        model: "grok-3"

# MCP settings — Phase 4 (plan 04-03)
# allowedDomains is required to permit internal Docker network hosts.
# LibreChat v0.8.5 has SSRF protection that blocks non-public domains by default.
# mcp-gateway runs on the xbrain_net bridge — must be explicitly allowed.
mcpSettings:
  allowedDomains:
    - "http://mcp-gateway:8081"
    # Phase 13.x — mcp-brain (active memory tools, per-user xbt_ token auth).
    - "http://mcp-brain:8104"

# MCP servers — Phase 4 (plan 04-03)
# Connects LibreChat to the xbrain MCP aggregate gateway which exposes
# calendar, drive-read, scraper (and deck after plan 04-08) as a single
# MCP server via streamable-http transport (LibreChat v0.8.5+).
mcpServers:
  xbrain:
    # MCP aggregate endpoint — all registered xbrain tools via mcp-gateway.
    # Requires mcp-gateway:8081 to be running (Phase 4, plan 04-02).
    # Transport: streamable-http (LibreChat v0.8.5+, supported since Q4 2025).
    # Tools: scraper, drive-read, calendar, deck (team-shared, stateless).
    type: streamable-http
    url: http://mcp-gateway:8081/mcp
    headers:
      X-Team-Scope: "${LIBRECHAT_DEFAULT_TEAM_SCOPE}"
      # X-LibreChat-User-Email injected by LibreChat from connected user profile.
      # Consumed by mcp-gateway in Phase 5 for sub resolution via memory-api /v1/me.
      X-LibreChat-User-Email: "{{LIBRECHAT_USER_EMAIL}}"

  # Active team-brain tools — memory_search, memory_add, tasks_list,
  # task_create/update, contacts_search, contact_add, agent_invoke,
  # team_context. Points straight at mcp-brain (not the gateway aggregate,
  # which hardcodes team_scope=default and would break team isolation).
  # mcp-brain resolves the caller's team_scope in two ways:
  #   1. TOKEN PATH: Authorization: Bearer xbt_... (ChatGPT/Claude.ai, explicit token).
  #   2. EMAIL PATH: X-LibreChat-User-Email + X-Internal-Secret — LibreChat-only,
  #      gated by BRIDGE_SHARED_SECRET. Team resolved server-side; no token needed.
  xbrain-memory:
    type: streamable-http
    url: http://mcp-brain:8104/mcp
    headers:
      Authorization: "Bearer {{XBRAIN_TOKEN}}"
      # LibreChat injects the authenticated user's email — used for server-side team
      # resolution when no xbt_ token is set (email path, LibreChat internal only).
      X-LibreChat-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      # Shared secret gating the email path — prevents public callers from using it.
      # Injected from LibreChat's environment (same BRIDGE_SHARED_SECRET as all services).
      X-Internal-Secret: "${BRIDGE_SHARED_SECRET}"
    customUserVars:
      XBRAIN_TOKEN:
        title: "xbrain API token (optional for LibreChat)"
        description: "Optional for LibreChat users — your team is auto-resolved from your login email. Required for ChatGPT/Claude.ai: copy your xbt_ token from <a href='https://grooveos.app/account/teams/' target='_blank'>grooveos.app/account/teams</a> (or the Chrome extension)."

# File handling (CHAT-04 partial — upload accepted; real RAG comes in Phase 2).
fileConfig:
  endpoints:
    Anthropic:
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "image/.+"
        - "application/pdf"
    OpenAI:
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "image/.+"
        - "application/pdf"

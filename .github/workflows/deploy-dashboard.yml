name: Deploy Dashboard to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Generate dashboard
        env:
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'dejavudev' }}
          GITHUB_USER: ${{ vars.GITHUB_USER || 'mrboups' }}
          XBRAIN_TEAM_SCOPE: ${{ vars.XBRAIN_TEAM_SCOPE || '' }}
          GITHUB_API_PAT: ${{ secrets.GH_API_PAT }}
          XBRAIN_BRIDGE_JWT: ${{ secrets.XBRAIN_BRIDGE_JWT }}
          XBRAIN_MEMORY_API_URL: https://api.grooveos.app
        run: |
          cd projects-dashboard
          python3 scripts/generate_dashboard.py
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          cd projects-dashboard
          firebase deploy --only hosting:projects --project xbrain-495115

name: Deploy Dashboard to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Generate dashboard
        env:
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'your-github-org' }}
          GITHUB_USER: ${{ vars.GITHUB_USER || 'mrboups' }}
          GITHUB_API_PAT: ${{ secrets.GITHUB_API_PAT }}
          XBRAIN_BRIDGE_JWT: ${{ secrets.XBRAIN_BRIDGE_JWT }}
          XBRAIN_MEMORY_API_URL: https://api.grooveos.app
        run: |
          cd projects-dashboard
          python3 scripts/generate_dashboard.py
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/50097563098/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-fbsvc@xbrain-495115.iam.gserviceaccount.com
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          projectId: xbrain-495115
          target: projects
          channelId: live
          entryPoint: ./projects-dashboard

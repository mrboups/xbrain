<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>xbrain — team chat</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    /* Design tokens — dark theme aligned with LibreChat.
       Kept here in addition to popup.css so the inline elements (button
       resets, scrollbars) get the same palette without an external load. */
    :root {
      color-scheme: dark;
      --xb-bg:        #171717;
      --xb-surface:   #212121;
      --xb-surface-2: #2a2a2a;
      --xb-border:    #2f2f2f;
      --xb-border-2: #3a3a3a;
      --xb-text:      #ececec;
      --xb-text-mute: #a0a0a0;
      --xb-text-dim:  #6b6b6b;
      --xb-accent:    #3b82f6;
      --xb-accent-2:  #2563eb;
      --xb-accent-bg: rgba(59, 130, 246, 0.16);
      --xb-success:   #10b981;
      --xb-success-bg:rgba(16, 185, 129, 0.14);
      --xb-error:     #ef4444;
      --xb-error-bg:  rgba(239, 68, 68, 0.14);
      --xb-radius:    8px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 320px;
      height: 100vh;
      background: var(--xb-bg);
      color: var(--xb-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--xb-bg); }
    ::-webkit-scrollbar-thumb { background: var(--xb-border-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  </style>
</head>
<body>
  <!-- App shell — full-height column layout. Header, body, footer. -->
  <div id="app">

    <!-- Header — team selector + presence + settings + LibreChat opener -->
    <header class="xb-header">
      <div class="xb-header-left">
        <span class="xb-logo" aria-hidden="true">🧠</span>
        <select id="teamSelector" class="xb-team-select" aria-label="Active team">
          <option value="" disabled selected>Loading…</option>
        </select>
        <span class="xb-presence" id="presenceBadge" title="Members online" hidden>
          <span class="xb-presence-dot"></span><span id="presenceCount">0</span>
        </span>
      </div>
      <div class="xb-header-right">
        <button type="button" id="btn-settings" class="xb-icon-btn" title="Settings">⚙️</button>
        <button type="button" id="btn-open-librechat" class="xb-icon-btn" title="Open LibreChat in new tab">💬</button>
      </div>
    </header>

    <!-- Connection card — shown only on first launch (no xbt_token). -->
    <section id="connection-card" class="xb-card" hidden>
      <h3>Connect xbrain</h3>
      <p class="xb-hint">
        Sign in with Google to start chatting with your team.
      </p>
      <button type="button" id="btn-connect-xbrain" class="connect-btn">🔑 Connect xbrain account</button>
      <div id="connect-status" hidden></div>
      <div id="github-link-row" hidden>
        <div class="xb-subcard">
          <strong>GitHub</strong>
          <small>Link to see your org teams</small>
          <button type="button" id="btn-link-github" class="link-btn">Link</button>
        </div>
      </div>
    </section>

    <!-- Chat body — message stream -->
    <main id="chat-body" class="xb-chat-body" aria-live="polite">
      <div id="chat-scroll" class="xb-chat-scroll">
        <div id="history-loader" class="xb-history-loader" hidden>Loading older messages…</div>
        <div id="message-list"></div>
      </div>
      <div id="chat-empty" class="xb-chat-empty" hidden>
        No messages yet. Be the first to say hello — or mention <code>@claude</code> to ask the team brain a question.
      </div>
    </main>

    <!-- Footer — clip + composer pill (LibreChat-style rounded container) -->
    <footer class="xb-composer">
      <div class="xb-composer-pill">
        <button type="button" id="btn-clip" class="xb-clip-btn" title="Send current page or selection to xbrain" aria-label="Clip page">
          <span aria-hidden="true">📎</span>
        </button>
        <textarea
          id="composer-input"
          rows="2"
          placeholder="Message your team — use @claude to ask the brain"
          aria-label="Compose message"
        ></textarea>
        <button type="button" id="btn-send" class="xb-send-btn" title="Send (Enter)  ·  Shift+Enter for newline" aria-label="Send">
          <span aria-hidden="true">↑</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Clip overlay — opens on 📎 click -->
  <div id="clip-overlay" class="xb-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="clip-overlay-title">
    <div class="xb-overlay-card">
      <header class="xb-overlay-header">
        <h3 id="clip-overlay-title">📎 Send to xbrain</h3>
        <button type="button" id="btn-clip-close" class="xb-icon-btn" title="Close">✕</button>
      </header>

      <div class="xb-overlay-body">
        <!-- What will be clipped (auto-detected: selection if any, else page) -->
        <div class="xb-field">
          <label>What will be sent</label>
          <div class="xb-clip-preview" id="clip-preview">
            <span class="xb-clip-preview-mode" id="clip-preview-mode">📄 Page</span>
            <span class="xb-clip-preview-detail" id="clip-preview-detail">—</span>
          </div>
        </div>

        <!-- Project -->
        <div class="xb-field">
          <label for="clip-project">Project (optional)</label>
          <input type="text" id="clip-project" placeholder="e.g. fundraising" autocomplete="off" />
        </div>

        <!-- Truth level -->
        <div class="xb-field">
          <label>Truth level</label>
          <div class="xb-radio-row">
            <label class="xb-radio-pill">
              <input type="radio" name="clipTruthLevel" value="EPHEMERAL" checked />
              EPHEMERAL
            </label>
            <label class="xb-radio-pill">
              <input type="radio" name="clipTruthLevel" value="WORKING" />
              WORKING
            </label>
            <label class="xb-radio-pill">
              <input type="radio" name="clipTruthLevel" value="VALIDATED" />
              VALIDATED
            </label>
            <label class="xb-radio-pill">
              <input type="radio" name="clipTruthLevel" value="CANONICAL" />
              CANONICAL
            </label>
          </div>
        </div>

        <!-- Use-defaults toggle -->
        <div class="xb-field">
          <label class="xb-checkbox-row">
            <input type="checkbox" id="clip-use-defaults" />
            Use these as defaults next time (skip this overlay)
          </label>
        </div>

        <div id="clip-status" hidden></div>
      </div>

      <footer class="xb-overlay-footer">
        <button type="button" id="btn-clip-cancel" class="xb-btn-secondary">Cancel</button>
        <button type="button" id="btn-clip-send" class="xb-btn-primary">Send</button>
      </footer>
    </div>
  </div>

  <!-- centrifuge-js: globalThis.Centrifuge -->
  <script src="vendor/centrifuge.js"></script>
  <!-- chat client + UI wiring -->
  <script src="popup.js" type="module"></script>
</body>
</html>

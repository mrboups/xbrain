<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) in app.css
       resolve to anything; without it the composer sits under the home
       indicator on a notched phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="GrooveOS team chat - your team's shared chat and memory." />
  <meta name="referrer" content="no-referrer" />
  <title>GrooveOS Team Chat</title>

  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
  <link rel="icon" href="/app/icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <!--
      Header — the extension's language, square for square: the team rail on the
      left, icon-only actions on the right. There is no product name here on
      purpose; the teams ARE the identity of this screen, and a title would only
      push them right.

      Deliberately NOT here (27-CONTEXT defers them out of the PWA): the board,
      the invite overlay, the people overlay, and add-page-to-memory, which needs
      a tab the page cannot read.
    -->
    <header class="xb-header">
      <div class="xb-header-left">
        <!-- One square per team, filled from /v1/teams/my-teams. Clicking one
             switches the thread; unread counts ride the square itself. Built by
             chat_core/team_rail.js — the SAME module the extension renders. -->
        <div id="team-rail" class="xb-team-rail" role="tablist" aria-label="Teams"></div>
      </div>

      <div class="xb-header-right">
        <!-- The ONLY control in this app that may ask the browser for
             notification access, and only from this click (D-27-05). push.js
             owns the data-state, the labels and whether it is disabled; the two
             bells below are both in the markup and CSS shows exactly one, so
             the state never needs a markup assignment to paint. The honest
             default is off + clickable, so a person who somehow never gets the
             first refresh still sees a working control. -->
        <button type="button" id="btn-enable-push" class="xb-icon-btn" data-state="off"
                aria-pressed="false" aria-label="Notifications off" hidden>
          <svg class="xb-ico-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <svg class="xb-ico-bell-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.73 21a2 2 0 01-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0118 8"/><path d="M6.26 6.26A5.86 5.86 0 006 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 00-9.33-5"/><path d="M1 1l22 22"/></svg>
        </button>

        <button type="button" id="btn-settings" class="xb-icon-btn"
                title="Settings" aria-label="Settings" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>

        <button type="button" id="btn-sign-out" class="xb-icon-btn"
                title="Sign out" aria-label="Sign out" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <!--
      Settings — a small panel under the header, not a page. Two things live
      here and nothing else: the display mode, and what notifications are
      actually doing on this device. The theme sits top-right of the panel
      header because it is a display mode, not an item to read past.
    -->
    <div id="settings-panel" class="xb-settings-panel" hidden>
      <div class="xb-settings-head">
        <span class="xb-settings-title">Settings</span>
        <div class="seg" role="group" aria-label="Theme">
          <button type="button" id="btn-theme-light" aria-pressed="false" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" id="btn-theme-dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
        </div>
      </div>
      <div class="xb-settings-row">
        <span class="xb-settings-label">Notifications</span>
        <!-- Written by push.js from the same read that paints the bell, so the
             two can never disagree. -->
        <span id="settings-push-state" class="xb-settings-value">Notifications off</span>
      </div>
    </div>

    <!-- Shown only when the notification state needs something this app cannot
         do itself: allow the permission in the browser's settings, or install
         the app on iOS. push.js owns the copy and the visibility. -->
    <p id="push-hint" class="xb-push-hint" role="status" hidden></p>

    <!-- Signed out -->
    <div id="signin-card" hidden>
      <h2>Sign in</h2>
      <p class="xb-sub">Same account you use in the extension.</p>

      <!-- Google FIRST: an account created through the extension has NO
           password, so a page offering only email and password could not
           authenticate those people at all. -->
      <div id="google-btn" class="xb-google-slot"></div>
      <p id="google-hint" class="xb-google-hint">Continue with your Google account.</p>

      <div class="xb-divider"><span>or</span></div>

      <form id="signin-form">
        <div class="xb-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="xb-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required />
        </div>
        <button type="submit" id="signin-btn" class="xb-btn xb-btn-primary xb-btn-block">
          Sign in
        </button>
      </form>

      <div id="signin-banner" class="xb-banner" hidden></div>
    </div>

    <!-- Connection state. Empty and hidden until the socket says otherwise. -->
    <p id="connection-banner" class="xb-connection-banner" role="status" hidden></p>

    <!--
      A teammate asking to open a link, shown in-page when no OS notification
      could be raised. It carries the full destination and an explicit Open
      button: nothing here moves the browser without a click (D-22-02).
    -->
    <div id="nudge-banner" class="xb-nudge-banner" role="alert" hidden></div>

    <!-- Signed in: the chat. chat.js fills #message-list. -->
    <div id="chat-scroll" hidden>
      <p id="history-loader" class="xb-history-loader" hidden>Loading older messages...</p>
      <div id="message-list"></div>
      <p id="chat-empty" hidden></p>
    </div>

    <p id="composer-error" class="xb-composer-error" role="alert" hidden></p>

    <!--
      Composer — the extension's pill, glyph for glyph. A textarea (not an
      input) so it grows with the text; "+" and "›" rather than a paperclip
      and an arrow, which render as colour emoji and fight the monochrome
      palette. Everything sits on one line until the content needs a second row.
    -->
    <div id="composer" class="xb-composer" hidden>
      <div class="xb-composer-pill">
        <button type="button" id="btn-clip" class="xb-clip-btn" title="Attach file" aria-label="Attach file">
          <span aria-hidden="true">+</span>
        </button>
        <input type="file" id="file-picker" accept="image/*,application/pdf,.txt,.md,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx" hidden />
        <textarea
          id="composer-input"
          rows="1"
          placeholder="Use @agent to interact with your team agent."
          aria-label="Compose message"
        ></textarea>
        <button type="button" id="btn-send" class="xb-send-btn" title="Send (Enter)  ·  Shift+Enter for newline" aria-label="Send">
          <span aria-hidden="true">&rsaquo;</span>
        </button>
      </div>
    </div>

    <p id="account-identity" hidden></p>
  </div>

  <!--
    Service worker registration.

    It lives inline here rather than in app.js so the worker is installed even
    if the module graph fails to load - a broken import must not also cost the
    offline shell. The guard matters: `serviceWorker` is absent in a non-secure
    context and in some embedded webviews, and an unguarded property read throws
    before anything renders.

    Scope is pinned to /app/ so this worker can never intercept /account/* or
    the marketing site, and it is registered on `load` so it competes with
    nothing during first paint.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" })
          .catch(function (e) {
            console.warn("[xbrain] sw registration failed:", e);
          });
      });
    }
  </script>

  <!--
    The vendored Centrifugo client (MIT), byte-identical to the extension's copy.
    It is a classic script, not a module, and it must run BEFORE ./app.js so
    globalThis.Centrifuge exists by the time chat.js hands the constructor to
    chat-core. A module script is deferred, so plain ordering is enough.
  -->
  <script src="./vendor/centrifuge.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>

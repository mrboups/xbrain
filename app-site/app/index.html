<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) in app.css
       resolve to anything; without it the composer sits under the home
       indicator on a notched phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="GrooveOS team chat - your team's shared chat and memory." />
  <meta name="referrer" content="no-referrer" />
  <title>GrooveOS Team Chat</title>

  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
  <link rel="icon" href="/app/icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">
    <header class="xb-header">
      <div class="xb-brand">
        <span class="xb-brand-mark" aria-hidden="true"></span>
        GrooveOS
      </div>

      <!-- Filled from /v1/teams/my-teams; changing it switches the thread. -->
      <select id="team-selector" aria-label="Team" hidden></select>

      <!-- The ONLY control in this app that may ask the browser for
           notification access, and only from this click (D-27-05). push.js
           owns the label, the data-state and whether it is disabled; the
           markup starts in the honest default (off, clickable) so a person who
           somehow never gets the first refresh still sees a working control
           rather than a dead one. -->
      <button type="button" id="btn-enable-push" class="xb-btn" data-state="off"
              aria-pressed="false" hidden>
        Notifications off
      </button>

      <button type="button" id="btn-sign-out" class="xb-btn" hidden>Sign out</button>
    </header>

    <!-- Shown only when the notification state needs something this app cannot
         do itself: allow the permission in the browser's settings, or install
         the app on iOS. push.js owns the copy and the visibility. -->
    <p id="push-hint" class="xb-push-hint" role="status" hidden></p>

    <!-- Signed out -->
    <div id="signin-card" hidden>
      <h2>Sign in</h2>
      <p class="xb-sub">Same account you use in the extension.</p>

      <!-- Google FIRST: an account created through the extension has NO
           password, so a page offering only email and password could not
           authenticate those people at all. -->
      <div id="google-btn" class="xb-google-slot"></div>
      <p id="google-hint" class="xb-google-hint">Continue with your Google account.</p>

      <div class="xb-divider"><span>or</span></div>

      <form id="signin-form">
        <div class="xb-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="xb-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required />
        </div>
        <button type="submit" id="signin-btn" class="xb-btn xb-btn-primary xb-btn-block">
          Sign in
        </button>
      </form>

      <div id="signin-banner" class="xb-banner" hidden></div>
    </div>

    <!-- Connection state. Empty and hidden until the socket says otherwise. -->
    <p id="connection-banner" class="xb-connection-banner" role="status" hidden></p>

    <!--
      A teammate asking to open a link, shown in-page when no OS notification
      could be raised. It carries the full destination and an explicit Open
      button: nothing here moves the browser without a click (D-22-02).
    -->
    <div id="nudge-banner" class="xb-nudge-banner" role="alert" hidden></div>

    <!-- Signed in: the chat. chat.js fills #message-list. -->
    <div id="chat-scroll" hidden>
      <p id="history-loader" class="xb-history-loader" hidden>Loading older messages...</p>
      <div id="message-list"></div>
      <p id="chat-empty" hidden></p>
    </div>

    <p id="composer-error" class="xb-composer-error" role="alert" hidden></p>

    <div id="composer" class="xb-composer" hidden>
      <textarea id="composer-input" rows="1" placeholder="Message your team"
                aria-label="Message"></textarea>
      <button type="button" id="btn-send" class="xb-btn xb-btn-primary">Send</button>
    </div>

    <p id="account-identity" hidden></p>
  </div>

  <!--
    Service worker registration.

    It lives inline here rather than in app.js so the worker is installed even
    if the module graph fails to load - a broken import must not also cost the
    offline shell. The guard matters: `serviceWorker` is absent in a non-secure
    context and in some embedded webviews, and an unguarded property read throws
    before anything renders.

    Scope is pinned to /app/ so this worker can never intercept /account/* or
    the marketing site, and it is registered on `load` so it competes with
    nothing during first paint.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" })
          .catch(function (e) {
            console.warn("[xbrain] sw registration failed:", e);
          });
      });
    }
  </script>

  <!--
    The vendored Centrifugo client (MIT), byte-identical to the extension's copy.
    It is a classic script, not a module, and it must run BEFORE ./app.js so
    globalThis.Centrifuge exists by the time chat.js hands the constructor to
    chat-core. A module script is deferred, so plain ordering is enough.
  -->
  <script src="./vendor/centrifuge.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
